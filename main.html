<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Speech Synthesis Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        textarea {
            width: 100%;
            height: 120px;
        }

        select,
        input[type="range"],
        button {
            margin-top: 10px;
            display: block;
            width: 300px;
        }

        label {
            display: block;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>Speech Synthesis Application</h1>

    <textarea
        id="text"
        placeholder="Enter text to speak..."
    ></textarea>

    <label for="voiceSelect">Select Voice:</label>
    <select id="voiceSelect"></select>

    <label for="rate">
        Rate:
        <span id="rateValue">1</span>
    </label>
    <input
        type="range"
        id="rate"
        min="0.5"
        max="2"
        step="0.1"
        value="1"
    >

    <label for="pitch">
        Pitch:
        <span id="pitchValue">1</span>
    </label>
    <input
        type="range"
        id="pitch"
        min="0"
        max="2"
        step
